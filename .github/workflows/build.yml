name: build-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Smoke-test production routes
        env:
          OPENAI_API_KEY: ""
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/courant.log 2>&1 &
          echo $! > /tmp/courant.pid
          node scripts/smoke.mjs
          status=$?
          kill "$(cat /tmp/courant.pid)" 2>/dev/null || true
          exit "$status"
