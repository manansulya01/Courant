name: build-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const audit = require("/tmp/npm-audit.json"); console.log("Audit summary:", JSON.stringify(audit.metadata?.vulnerabilities ?? {})); for (const [name, issue] of Object.entries(audit.vulnerabilities ?? {})) console.log(`${name}: ${issue.severity}; direct=${issue.isDirect}; fixAvailable=${JSON.stringify(issue.fixAvailable)}`);'
      - run: npm run lint
      - run: npm run build
      - name: Smoke-test production routes
        env:
          OPENAI_API_KEY: ""
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/courant.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/smoke.mjs
